name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  synthetic-tests:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            architecture: x64
          - os: macos-15
            architecture: arm64
            target: macos-arm64
          - os: windows-2025
            architecture: x64
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
          architecture: ${{ matrix.architecture }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare the test venv
        env:
          DESKTOP_TARGET: ${{ matrix.target }}
        run: |
          $venv = Join-Path $env:RUNNER_TEMP source-tests
          if ($env:DESKTOP_TARGET) {
            python -I -B tools/prepare_build.py --out $venv --target $env:DESKTOP_TARGET
          } else {
            # Linux source tests have no external runtime dependency.
            python -I -B -m venv --without-pip $venv
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = if ($IsWindows) { 'Scripts/python.exe' } else { 'bin/python' }
          $python = Join-Path $venv $exe
          $bin = Split-Path -Parent $python
          # The Node suites spawn python3 directly. Windows venvs supply python.exe.
          if ($IsWindows) { Copy-Item $python (Join-Path $bin 'python3.exe') }
          $bin >> $env:GITHUB_PATH
          "VENV_PYTHON=$python" >> $env:GITHUB_ENV
      - run: python3 -I -c "import os, pathlib, sys; assert pathlib.Path(sys.prefix).resolve() == pathlib.Path(os.environ['VENV_PYTHON']).parent.parent.resolve()"
      - run: '& $env:VENV_PYTHON -E -s -m unittest discover -s tests -v'
      - run: node tests/test_ui_actions.cjs
      - run: node tests/test_ui_communication.cjs
      - run: node tests/test_ui_today.cjs
      - run: node tests/test_ui_reader.cjs
      - run: node tests/test_browser_reader.cjs
      - run: node tests/test_reader_discovery.cjs
      - run: node tests/test_reader_pipeline.cjs
      - run: node --check static/app.js
