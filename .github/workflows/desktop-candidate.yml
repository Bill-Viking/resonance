name: Desktop Intel source-runtime diagnostic
# Manual, public unsigned diagnostic only. It builds the Mac runtime from pinned source archives on a
# native Intel runner, then runs the product's own build, test, export and package chain.
# Not eligible for hosted signing and never a public release: the output is unsigned evidence
# stored in this job's diagnostic artifacts. No release is published.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  intel-source-runtime:
    if: github.event_name == 'workflow_dispatch' && github.event.repository.private == false && github.ref == 'refs/heads/codex/public-intel-diagnostic-20261114'
    runs-on: macos-15-intel
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      DESKTOP_TARGET: macos-x86_64
      PYTHONNOUSERSITE: '1'
      # Exact audited public product source for this diagnostic.
      PRODUCT_SOURCE_SHA: 6c2bbc0df69e28e7f2a670f3c4d60614f22de119
      # SHA-256 of the eight reviewed recipe files below .github/native-runtime/.
      SHA_SOURCE_INPUTS: d8e732285c937663dfc050a26f1c72f82e4d13186552998505d19dc761e0f16c
      SHA_BUILD_LOCAL: 4762d718390fc9d456d1230274a4702e2e0401de68d42697f4deff79d06f2bf5
      SHA_TEST_BUILD_LOCAL: 6ce7c95f472315d089f0ecdb9b8ccf40cdc5de9b52e1410821cf83f86073c471
      SHA_FETCH: 684516c0edb26ddbddad7b09aa1fc471fd7b376aaca6cf69424db82f6387c1eb
      SHA_DIAGNOSE_SUITE: 2abf8745d63e1908b998d3a4c62b4859002fccc523fb9b013ee8d8ea6636fec0
      SHA_TEST_DIAGNOSE_SUITE: 7b4f75c2f428d7b97a4225cedd8f84f4c6acd2f70e3a0c357f812edadac2db64
      SHA_EMIT_EVIDENCE: f4f1357df7f572112a4b171b1a38650380a15118116e8fa70404534552929c4f
      SHA_TEST_EMIT_EVIDENCE: c22f925bd9acb54066e289ff1439cb4ea2eb44aa9b44a6a909fc3117758356f4
    steps:
      # The recipe checkout is the workflow's own commit. The product checkout is the exact pinned
      # source, so recipe files never enter the export or make its Git tree dirty.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 6c2bbc0df69e28e7f2a670f3c4d60614f22de119
          path: source
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
          architecture: x64
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check both checkouts
        run: |
          test "$(git -C "$GITHUB_WORKSPACE/recipe" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" = "$PRODUCT_SOURCE_SHA"
          test -z "$(git -C "$GITHUB_WORKSPACE/source" status --porcelain)"
          test "$(uname -m)" = x86_64
      - name: Bootstrap the isolated runtime root
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/res-native-runtime"
          recipe="$GITHUB_WORKSPACE/recipe/.github/native-runtime"
          bootstrap_python="$(command -v python)"
          case "$bootstrap_python" in /*) ;; *) exit 1 ;; esac
          test -x "$bootstrap_python"
          mkdir -m 0700 "$root"
          mkdir -m 0700 "$root/scripts" "$root/downloads"
          cp "$recipe/SOURCE-INPUTS.json" "$root/SOURCE-INPUTS.json"
          cp "$recipe/build-local.py" "$recipe/test_build_local.py" "$recipe/fetch.py" "$root/scripts/"
          cp "$recipe/diagnose-suite.py" "$recipe/test_diagnose_suite.py" "$root/scripts/"
          cp "$recipe/emit-evidence.py" "$recipe/test_emit_evidence.py" "$root/scripts/"
          check_sha() {
            actual="$(shasum -a 256 "$1" | cut -d ' ' -f 1)"
            if [ "$actual" != "$2" ]; then
              echo "SHA-256 mismatch for $1: expected $2, got $actual" >&2
              exit 1
            fi
          }
          check_sha "$root/SOURCE-INPUTS.json" "$SHA_SOURCE_INPUTS"
          check_sha "$root/scripts/build-local.py" "$SHA_BUILD_LOCAL"
          check_sha "$root/scripts/test_build_local.py" "$SHA_TEST_BUILD_LOCAL"
          check_sha "$root/scripts/fetch.py" "$SHA_FETCH"
          check_sha "$root/scripts/diagnose-suite.py" "$SHA_DIAGNOSE_SUITE"
          check_sha "$root/scripts/test_diagnose_suite.py" "$SHA_TEST_DIAGNOSE_SUITE"
          check_sha "$root/scripts/emit-evidence.py" "$SHA_EMIT_EVIDENCE"
          check_sha "$root/scripts/test_emit_evidence.py" "$SHA_TEST_EMIT_EVIDENCE"
          echo "RES_ROOT=$root" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_PYTHON=$bootstrap_python" >> "$GITHUB_ENV"
      - name: Run the synthetic suite supervisor tests
        timeout-minutes: 2
        run: |
          set -euo pipefail
          "$BOOTSTRAP_PYTHON" -I -B "$RES_ROOT/scripts/test_diagnose_suite.py" 2>&1 | tee "$RES_ROOT/test-diagnose-suite.log"
      - name: Run the synthetic inline evidence tests
        timeout-minutes: 2
        run: |
          set -euo pipefail
          "$BOOTSTRAP_PYTHON" -I -B "$RES_ROOT/scripts/test_emit_evidence.py" 2>&1 | tee "$RES_ROOT/test-emit-evidence.log"
      - name: Run the 38 synthetic build-recipe tests
        run: |
          set -euo pipefail
          cd "$RES_ROOT"
          python -I scripts/test_build_local.py 2>&1 | tee "$RES_ROOT/test-build-local.log"
          grep -q '^Ran 38 tests' "$RES_ROOT/test-build-local.log"
      - name: Fetch the nine pinned source archives
        run: |
          set -euo pipefail
          cd "$RES_ROOT"
          python -I scripts/fetch.py "$RES_ROOT"
      # fetch.py exits zero even when an archive does not match, so check its receipt here.
      - name: Validate the fetch receipt
        run: |
          python -I - <<'PY'
          import json, os, sys
          root = os.environ["RES_ROOT"]
          expected = {"cpython", "openssl", "tcl", "tk", "libffi", "xz", "sqlite", "mpdecimal", "zstd"}
          catalog = {s["name"]: s["sha256"] for s in json.load(open(os.path.join(root, "SOURCE-INPUTS.json")))["sources"]}
          receipt = json.load(open(os.path.join(root, "FETCH-RECEIPT.json")))
          names = [r.get("name") for r in receipt]
          bad = []
          if len(receipt) != 9 or len(set(names)) != 9 or set(names) != expected or set(catalog) != expected:
              bad.append(f"expected exactly the 9 distinct names {sorted(expected)}, got {names}")
          for r in receipt:
              if r.get("error") or r.get("match") is not True or r.get("actual_sha256") != catalog.get(r.get("name")):
                  bad.append(f"{r.get('name')}: error={r.get('error')} match={r.get('match')}")
          if bad:
              sys.exit("FETCH-RECEIPT validation failed: " + "; ".join(bad))
          print("FETCH-RECEIPT: 9 of 9 archives match their pinned digests")
          PY
      - name: Build the Mac runtime from source
        run: |
          set -euo pipefail
          cd "$RES_ROOT"
          python -I -u scripts/build-local.py --out "$RES_ROOT/build" --run 2>&1 | tee "$RES_ROOT/build-stdout.log"
      - name: Verify the build receipt and export the base interpreter
        run: |
          python -I - <<'PY'
          import json, os, sys
          root = os.environ["RES_ROOT"]
          rec = json.load(open(os.path.join(root, "build", "BUILD-RECEIPT.json")))
          probe = rec.get("probe", {})
          bad = []
          if rec.get("status") != "diagnostic-build-complete":
              bad.append(f"status={rec.get('status')!r}")
          if probe.get("machine") != "x86_64":
              bad.append(f"machine={probe.get('machine')!r}")
          if probe.get("deployment_target") != "13.0":
              bad.append(f"deployment_target={probe.get('deployment_target')!r}")
          if rec.get("accepted") is not False or rec.get("signed") is not False:
              bad.append("receipt accepted/signed flags are not both false")
          expected_checks = {
              "python_version_3.14.10", "implementation_cpython", "gil_not_disabled",
              "native_arch", "sysconfig_target_13.0", "nonframework", "all_imports_ok",
              "tcl_patch_9.0.4", "tk_major_9", "openssl_3.5.9", "sqlite_3.50.4",
              "libmpdec_4.0.1", "tkinter_ssl_ctypes_inside_prefix", "sys_prefix_is_private_prefix",
              "pip_inside_prefix", "no_user_site_flag",
          }
          checks = rec.get("probe_checks")
          if (not isinstance(checks, dict) or set(checks) != expected_checks
                  or any(value is not True for value in checks.values())):
              bad.append("all 16 distinct runtime probe checks must be true")
          if type(rec.get("probe_returncode")) is not int or rec["probe_returncode"] != 0:
              bad.append("probe return code must be zero")
          steps = rec.get("steps")
          if (not isinstance(steps, list) or len(steps) != 28
                  or any(not isinstance(step, dict) or step.get("status") != "ok" for step in steps)):
              bad.append("all 28 build steps must succeed")
          if rec.get("script_sha256") != os.environ["SHA_BUILD_LOCAL"]:
              bad.append("build script digest differs from the reviewed input")
          if rec.get("catalog_sha256") != os.environ["SHA_SOURCE_INPUTS"]:
              bad.append("source catalog digest differs from the reviewed input")
          if bad:
              sys.exit("BUILD-RECEIPT validation failed: " + "; ".join(bad))
          print("BUILD-RECEIPT: x86_64, deployment target 13.0, diagnostic-build-complete")
          PY
          test -x "$RES_ROOT/build/prefix/bin/python3.14"
          echo "BASE_PYTHON=$RES_ROOT/build/prefix/bin/python3.14" >> "$GITHUB_ENV"
      - name: Verify Tcl/Tk without zipfs and the pinned Tk header
        run: |
          python -I - <<'PY'
          import glob, os, re, subprocess, sys
          root = os.environ["RES_ROOT"]
          build = os.path.join(root, "build")
          prefix = os.path.join(build, "prefix")
          bad = []
          for comp in ("tcl", "tk"):
              logs = glob.glob(os.path.join(build, "logs", f"*-{comp}-configure.log"))
              if len(logs) != 1:
                  bad.append(f"{comp}: expected one configure log, found {logs}")
                  continue
              lines = [l for l in open(logs[0], errors="replace") if "zipfs" in l.lower()]
              if not any(re.search(r"zipfs.*\.\.\. no\s*$", l, re.I) for l in lines):
                  bad.append(f"{comp}: configure log has no 'zipfs ... no' line")
              if any(re.search(r"zipfs.*\.\.\. yes\s*$", l, re.I) for l in lines):
                  bad.append(f"{comp}: configure log reports zipfs yes")
          for rel in ("lib/tcl9.0/init.tcl", "lib/tk9.0/tk.tcl"):
              p = os.path.join(prefix, rel)
              if not (os.path.isfile(p) and not os.path.islink(p)):
                  bad.append(f"missing ordinary file {rel}")
          header = os.path.join(build, "sources", "tk", "tk9.0.5", "generic", "tk.h")
          if not re.search(r'^#\s*define\s+TK_PATCH_LEVEL\s+"9\.0\.5"\s*$', open(header, errors="replace").read(), re.M):
              bad.append("generic/tk.h does not report TK_PATCH_LEVEL 9.0.5")
          cfg = os.path.join(prefix, "lib", "tkConfig.sh")
          out = subprocess.run(["/bin/sh", "-c", '. "$1" || exit 1; printf "%s\\0" "$TK_VERSION" "$TK_PATCH_LEVEL"', "sh", cfg],
                               capture_output=True, check=True, stdin=subprocess.DEVNULL, timeout=60).stdout
          version, patch = out.decode().split("\0")[:2]
          if version + patch != "9.0.5" and patch != "9.0.5":
              bad.append(f"tkConfig.sh reports {version!r} + {patch!r}, not 9.0.5")
          if bad:
              sys.exit("Tcl/Tk checks failed: " + "; ".join(bad))
          print("Tcl/Tk: zipfs disabled, ordinary init.tcl and tk.tcl present, Tk 9.0.5 in tk.h and tkConfig.sh")
          PY
      - name: Prepare the locked build venv on the source-built Python
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/build-venv"
          python -I -B tools/prepare_build.py --python "$BASE_PYTHON" --target "$DESKTOP_TARGET" --out "$venv"
          echo "$venv/bin" >> "$GITHUB_PATH"
          echo "VENV_PYTHON=$venv/bin/python" >> "$GITHUB_ENV"
      - run: python3 -I -c "import os, pathlib, sys; assert pathlib.Path(sys.prefix).resolve() == pathlib.Path(os.environ['VENV_PYTHON']).parent.parent.resolve()"
      # Trace timers diagnose stalls and do not waive any product test.
      - name: Diagnose the export guard in isolation
        timeout-minutes: 3
        run: |
          set -euo pipefail
          "$VENV_PYTHON" -E -s -u - <<'PY' 2>&1 | tee "$RES_ROOT/export-guard-diagnostic.log"
          import faulthandler
          import runpy
          import sys

          faulthandler.enable()
          faulthandler.dump_traceback_later(30, repeat=True)
          sys.argv = ['unittest', 'discover', '-s', 'tests', '-p', 'test_release.py', '-k',
                      'different_commit_is_never_tagged', '-v', '--durations', '1']
          try:
              runpy.run_module('unittest', run_name='__main__', alter_sys=True)
          finally:
              faulthandler.cancel_dump_traceback_later()
          PY
      - name: Run all Python tests with bounded stall diagnostics
        timeout-minutes: 10
        run: |
          set -euo pipefail
          "$BOOTSTRAP_PYTHON" -I -B "$RES_ROOT/scripts/diagnose-suite.py" \
            --output "$RES_ROOT/native-stack-diagnostic" --timeout 540 --sample-after 180 -- \
            "$VENV_PYTHON" -E -s -u -c '
          import faulthandler
          import json
          import platform
          import runpy
          import subprocess
          import sys
          import sysconfig

          print("runtime features: " + json.dumps({
              "implementation": sys.implementation.name,
              "version": list(sys.version_info[:3]),
              "machine": platform.machine(),
              "_USE_POSIX_SPAWN": getattr(subprocess, "_USE_POSIX_SPAWN", None),
              "_HAVE_POSIX_SPAWN_CLOSEFROM": getattr(subprocess, "_HAVE_POSIX_SPAWN_CLOSEFROM", None),
              "sysconfig": {name: bool(sysconfig.get_config_var(name)) for name in (
                  "HAVE_FORK", "HAVE_VFORK", "HAVE_POSIX_SPAWN", "HAVE_POSIX_SPAWNP",
                  "HAVE_POSIX_SPAWN_FILE_ACTIONS_ADDCLOSEFROM_NP",
              )},
          }, sort_keys=True))

          faulthandler.enable()
          faulthandler.dump_traceback_later(120, repeat=True)
          sys.argv = ["unittest", "discover", "-s", "tests", "-v", "--durations", "15"]
          try:
              runpy.run_module("unittest", run_name="__main__", alter_sys=True)
          finally:
              faulthandler.cancel_dump_traceback_later()
          '
      - run: node tests/test_ui_actions.cjs
      - run: node tests/test_ui_communication.cjs
      - run: node tests/test_ui_today.cjs
      - run: node tests/test_ui_reader.cjs
      - run: node tests/test_browser_reader.cjs
      - run: node tests/test_reader_discovery.cjs
      - run: node tests/test_reader_pipeline.cjs
      # The release exporter runs the exported tree's own suites with this venv.
      - name: Export and test the public runtime
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          "$VENV_PYTHON" -I -B tools/make_release.py --version "$version" --out "$RUNNER_TEMP/runtime"
      - name: Plan the native candidate
        run: |
          "$VENV_PYTHON" -I -B tools/build_desktop.py --target "$DESKTOP_TARGET" --runtime "$RUNNER_TEMP/runtime" --out "$RUNNER_TEMP/candidate" --tk-patch-level 9.0.5 --plan
      # 9.0.5 is the independently checked level of the pinned Tk snapshot (pre-release 33904f039f48ed64).
      # This is a build check only, not a claim that Tk works at run time.
      - name: Build the native candidate
        run: |
          "$VENV_PYTHON" -I -B tools/build_desktop.py --target "$DESKTOP_TARGET" --runtime "$RUNNER_TEMP/runtime" --out "$RUNNER_TEMP/candidate" --tk-patch-level 9.0.5
          cp "$RUNNER_TEMP"/build-venv/build-evidence/pip-*.json "$RUNNER_TEMP/candidate/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resonance-diagnostic-unsigned-macos-x86_64
          path: |
            ${{ runner.temp }}/candidate/*.zip
            ${{ runner.temp }}/candidate/BUILD-MANIFEST.json
            ${{ runner.temp }}/candidate/pip-*.json
          if-no-files-found: error
          retention-days: 1
      - name: Emit scrubbed native evidence in the job log
        if: always()
        timeout-minutes: 1
        run: |
          set -euo pipefail
          if [ -z "${BOOTSTRAP_PYTHON:-}" ]; then
            echo "native evidence: bootstrap Python unavailable"
            exit 0
          fi
          "$BOOTSTRAP_PYTHON" -I -B "$RES_ROOT/scripts/emit-evidence.py" "$RES_ROOT/native-stack-diagnostic"
      # Evidence only: no source archives, prefix, repo.git or private files.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: resonance-intel-source-build-evidence
          path: |
            ${{ runner.temp }}/res-native-runtime/SOURCE-INPUTS.json
            ${{ runner.temp }}/res-native-runtime/FETCH-RECEIPT.json
            ${{ runner.temp }}/res-native-runtime/build/BUILD-RECEIPT.json
            ${{ runner.temp }}/res-native-runtime/build/logs
            ${{ runner.temp }}/res-native-runtime/build-stdout.log
            ${{ runner.temp }}/res-native-runtime/test-build-local.log
            ${{ runner.temp }}/res-native-runtime/export-guard-diagnostic.log
            ${{ runner.temp }}/res-native-runtime/test-diagnose-suite.log
            ${{ runner.temp }}/res-native-runtime/test-emit-evidence.log
            ${{ runner.temp }}/res-native-runtime/native-stack-diagnostic
          if-no-files-found: warn
          retention-days: 1
