<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b0d">
  <meta name="description" content="Resonance — your social brief, communication assistant, and personal brand agent.">
  <title>Resonance</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Workspace navigation">
      <a class="brand" href="#overview" aria-label="Resonance Today"><span>Resonance<span class="brand-caption">Your social brief, communication assistant, and personal brand agent.</span></span></a>
      <div class="nav-label">WORKSPACE</div>
      <nav class="primary-nav" aria-label="Main"><a href="#overview" data-nav="overview"></a><a href="#review" data-nav="review"></a><a href="#mail" data-nav="mail"></a><a href="#accounts" data-nav="accounts"></a><a href="#monitoring" data-nav="monitoring"></a><a href="#draft" data-nav="draft"></a></nav>
      <div class="sidebar-bottom">
        <div class="local-note"><span class="local-dot" aria-hidden="true"></span><strong>Your private workspace</strong><p>Saved on this computer.<br>You decide what happens next.</p></div>
        <button class="settings-button" data-action="settings" aria-label="Settings and data"><span class="settings-icon" aria-hidden="true"></span><span>Settings &amp; data</span><span class="settings-arrow" aria-hidden="true">↗</span></button>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="breadcrumb">Workspace <span aria-hidden="true">/</span> <strong id="current-view">Today</strong></div><div class="topbar-right"><span class="edition-label">LOCAL EDITION</span><button class="avatar-button" id="profile-button" data-action="settings" aria-label="Open settings">S</button></div></header>
      <div id="connection-notice" class="connection-notice" role="status" hidden></div>
      <div id="sample-banner" class="sample-banner" role="status" hidden></div>
      <main id="main" tabindex="-1"><div class="loading-screen"><span class="loading-ring" aria-hidden="true"></span><p>Getting your brief ready…</p></div></main>
      <footer class="workspace-footer"><span>LOCAL WORKSPACE · Saved on this computer</span><button class="text-button" data-action="about">What Resonance can see <span aria-hidden="true">↗</span></button></footer>
    </div>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><div class="noscript-notice">Resonance needs JavaScript to open your workspace. Enable JavaScript in your browser, then reload this page.</div></noscript>
</body>
</html>
